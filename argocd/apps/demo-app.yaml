apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/collin-smith/eks-gitops-observability.git
    targetRevision: main
    path: helm/demo-app
    helm:
      parameters:
        - name: image.repository
          value: "<account-id>.dkr.ecr.us-east-1.amazonaws.com/eks-gitops-observability/demo-app"
        - name: image.tag
          value: "latest"
        - name: database.url
          value: "postgresql://demo:password@postgres-postgresql:5432/demo"
        - name: serviceMonitor.enabled
          value: "true"
        - name: autoscaling.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Stage 7: with autoscaling on, the HPA writes spec.replicas on the
  # Deployment. The chart no longer renders that field (see deployment.yaml),
  # but ArgoCD would still flag the live value as drift and, with selfHeal,
  # revert every scale-out. Telling it to ignore that one path hands
  # ownership of replica count to the HPA.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: demo-app-demo-app
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
