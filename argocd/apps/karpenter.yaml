apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  source:
    # Karpenter's chart is published as an OCI artifact on ECR Public.
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    # Pin deliberately. Before bumping, check that
    # terraform/modules/karpenter's controller policy still matches this
    # release's cloudformation.yaml.
    targetRevision: "1.14.1"
    helm:
      values: |
        replicas: 1
        # Keep the controller on the managed node group, never on a node it
        # provisioned itself (this affinity ships in the chart defaults --
        # repeated here only because we override the values block wholesale).
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: karpenter.sh/nodepool
                      operator: DoesNotExist
        controller:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/eks-gitops-observability-dev-karpenter-controller
        settings:
          clusterName: eks-gitops-observability-dev
          # SQS queue from terraform/modules/karpenter. clusterEndpoint is
          # left unset -- Karpenter discovers it via eks:DescribeCluster.
          interruptionQueue: eks-gitops-observability-dev-karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Karpenter ships its own CRDs (NodePool, EC2NodeClass, NodeClaim) in
      # the chart; they exceed kubectl's client-side apply annotation limit.
      - ServerSideApply=true
