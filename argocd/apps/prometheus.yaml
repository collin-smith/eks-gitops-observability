apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.5.4
    helm:
      values: |
        # Stage 6 turns Grafana on. It ships inside kube-prometheus-stack --
        # Stage 5 deliberately disabled it so that release mapped to one
        # clear addition (Prometheus). Custom dashboards are provisioned
        # separately via the grafana-dashboards chart (argocd/apps/grafana.yaml),
        # which the sidecar below discovers from labelled ConfigMaps.
        grafana:
          enabled: true
          # kube-prometheus-stack's default admin password. A documented
          # simplification, same class as the app's plain-Secret DB URL --
          # production would source this from a real secret store.
          adminPassword: prom-operator
          defaultDashboardsEnabled: true
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # Grafana 13 + both config sidecars contend on SQLite at
              # startup; a tight CPU limit throttles that badly and the
              # liveness probe can kill the pod mid-boot. 500m gives it room.
              cpu: 500m
              memory: 384Mi
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              # Honour the grafana_folder annotation the chart sets, so the
              # demo-app dashboard lands in its own UI folder rather than
              # "General".
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
        # t3.small's ~11-pod-per-node ceiling (an EKS/ENI limit, not a
        # resource one) means a DaemonSet doesn't reliably fit across every
        # node without either a bigger instance type or real overprovisioned
        # headroom -- not worth chasing for a demo cluster. See 05-prometheus.md.
        nodeExporter:
          enabled: false
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
        prometheus:
          prometheusSpec:
            # Pick up any ServiceMonitor in the cluster, not just ones
            # carrying this release's own label -- demo-app's chart is a
            # separate release and shouldn't need to know this stack's
            # release name to be discovered.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
            retention: 6h
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack's CRDs (Prometheus, Alertmanager, ...) exceed
      # kubectl's 262144-byte last-applied-configuration annotation limit --
      # client-side apply (ArgoCD's default) rejects them outright.
      - ServerSideApply=true
