{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "demo-app.fullname" . }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "demo-app.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # Custom metric served by prometheus-adapter (Stage 7): per-pod requests
    # per second, derived from the app's own http_requests_total counter.
    - type: Pods
      pods:
        metric:
          name: {{ .Values.autoscaling.metricName }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetAverageValue | quote }}
  behavior:
    scaleDown:
      # Don't thrash — wait for a sustained lull before scaling in.
      stabilizationWindowSeconds: 120
{{- end }}
