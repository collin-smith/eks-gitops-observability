replicaCount: 1

image:
  # Set via --set image.repository=<ecr_repository_url> (from `terraform output ecr_repository_url`)
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# DATABASE_URL for the app. In this project it's a plain Secret value passed
# via --set or a values override -- a documented simplification. Production
# would use Sealed Secrets, External Secrets, or SOPS instead.
database:
  url: ""

probes:
  path: /health

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Off by default -- the ServiceMonitor CRD only exists once Stage 5's
# Prometheus Operator is installed. Stage 5 turns this on via the
# Application's helm parameters once that's true.
serviceMonitor:
  enabled: false
  interval: 15s

# Stage 7. Off by default -- the custom metric (metricName) only resolves
# once prometheus-adapter is running. The Application turns this on via a
# helm parameter, and also adds ignoreDifferences on /spec/replicas so
# ArgoCD stops fighting the HPA.
autoscaling:
  enabled: false
  minReplicas: 1
  # High enough that a load test scales past what the baseline node group
  # can hold -- the overflow pods go Pending and Karpenter provisions a node.
  maxReplicas: 25
  metricName: http_requests_per_second
  # Scale so each pod handles ~5 req/s; a light load test pushes well past
  # this and triggers scale-out within a reconcile or two.
  targetAverageValue: "5"
