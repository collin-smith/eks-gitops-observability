{{- /*
One ConfigMap per JSON file in dashboards/. The Grafana sidecar
(kube-prometheus-stack) watches for ConfigMaps carrying the label below and
loads their contents as dashboards -- no Grafana restart, no manual import.
*/ -}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $name := $path | base | trimSuffix ".json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{ $.Values.sidecarLabel }}: "1"
  annotations:
    # Sidecar reads this to file the dashboard under a folder in the UI.
    grafana_folder: {{ $.Values.folder | quote }}
data:
  {{ $name }}.json: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
