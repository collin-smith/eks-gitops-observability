apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Same IAM role the managed node group uses (worker + CNI + ECR policies).
  # Karpenter creates and manages the instance profile for it.
  role: eks-gitops-observability-dev-node

  # The alias drives both the AMI and the family (AL2023) + bootstrap logic;
  # in v1 you don't set amiFamily separately when using an alias.
  amiSelectorTerms:
    - alias: al2023@latest

  # Both selectors match the karpenter.sh/discovery tag: the vpc module
  # puts it on the private subnets, the karpenter module puts it on the
  # EKS-managed cluster security group.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-gitops-observability-dev
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-gitops-observability-dev

  # Karpenter tags everything it launches with
  # kubernetes.io/cluster/<name>=owned and eks:eks-cluster-name automatically
  # (and rejects those keys here). Extra custom tags would go under spec.tags.
  tags:
    project: eks-gitops-observability
    stage: "7-autoscaling"
