# Marks gp3 as the cluster's default StorageClass, backed by the EBS CSI
# driver addon (terraform/modules/eks). Applied via kubectl rather than
# Terraform's kubernetes provider -- one resource didn't justify wiring up a
# second provider + cluster auth just for this.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
